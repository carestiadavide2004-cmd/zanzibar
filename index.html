<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Zanzibar · Bar &amp; Lounge — Menu</title>
  <meta name="description" content="Il menu di Zanzibar Bar & Lounge: caffetteria, colazioni, aperitivi, cocktail, snack e dolci.">
  <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c0643f'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23f6efe6'%3EZ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Zanzibar, torna all'inizio">
      <svg class="brand-leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V11M12 11C10 6 6 4 2 5c3 1 6 3 10 6Zm0 0c2-5 6-7 10-6-3 1-6 3-10 6Zm0 0C9 8 5 9 3 12c3-1 6-1 9-1Zm0 0c3-3 7-2 9 1-3-1-6-1-9-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text">
        <span class="brand-name">Zanzibar</span>
        <span class="brand-sub">Bar · Lounge</span>
      </span>
    </a>
    <button class="burger" id="burger" aria-label="Apri menu del sito" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- TAB CATEGORIE -->
  <nav class="tabs" id="tabs" aria-label="Categorie del menu"></nav>

  <!-- MENU -->
  <main id="top" class="menu" aria-label="Menu">
    <div id="menu"></div>
    <footer class="menu-foot">
      <svg class="ornament" viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6h48M72 6h48" stroke="currentColor" stroke-width=".8"/><path d="M60 1.5 64.5 6 60 10.5 55.5 6Z" fill="none" stroke="currentColor" stroke-width=".8"/></svg>
      <p>Prezzi IVA inclusa · Servizio al tavolo</p>
      <p>Per allergie e intolleranze chiedi al nostro staff.</p>
    </footer>
  </main>

  <!-- PANNELLO HAMBURGER -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Informazioni sul locale">
    <div class="drawer-head">
      <button class="back" id="back" aria-label="Indietro" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="drawer-title" id="drawerTitle">Zanzibar</span>
      <button class="close" id="close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <!-- Lista voci -->
      <nav class="view is-active" data-view="nav">
        <ul class="nav-list">
          <li><button data-go="menu"><em>01</em><span>Menu</span><small>Torna alla carta</small></button></li>
          <li><button data-go="about"><em>02</em><span>Chi siamo</span><small>Il nostro locale</small></button></li>
          <li><button data-go="gallery"><em>03</em><span>Galleria</span><small>Uno sguardo all'atmosfera</small></button></li>
          <li><button data-go="contacts"><em>04</em><span>Contatti &amp; orari</span><small>Telefono, social, aperture</small></button></li>
          <li><button data-go="map"><em>05</em><span>Dove siamo</span><small>Mappa e indicazioni</small></button></li>
        </ul>
        <p class="nav-foot" id="navFoot"></p>
      </nav>

      <section class="view" data-view="about" data-title="Chi siamo"><div id="about"></div></section>
      <section class="view" data-view="gallery" data-title="Galleria"><div class="gallery" id="gallery"></div></section>
      <section class="view" data-view="contacts" data-title="Contatti & orari"><div id="contacts"></div></section>
      <section class="view" data-view="map" data-title="Dove siamo"><div id="map"></div></section>
    </div>
  </aside>

  <!-- SCHEDA PRODOTTO (si apre toccando una voce del menu) -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName" hidden>
    <div class="sheet-scrim" data-close-sheet></div>
    <article class="sheet-card" id="sheetCard">
      <span class="sheet-grip" aria-hidden="true"></span>
      <button class="sheet-close" data-close-sheet aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="sheet-media">
        <div class="sheet-ph" id="sheetPh" aria-hidden="true">
          <svg class="sheet-ph-leaf" viewBox="0 0 24 24"><path d="M12 22V11M12 11C10 6 6 4 2 5c3 1 6 3 10 6Zm0 0c2-5 6-7 10-6-3 1-6 3-10 6Zm0 0C9 8 5 9 3 12c3-1 6-1 9-1Zm0 0c3-3 7-2 9 1-3-1-6-1-9-1Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="sheet-ph-name" id="sheetPhName"></span>
          <span class="sheet-ph-brand">Zanzibar</span>
        </div>
        <img id="sheetImg" alt="" decoding="async">
      </div>
      <div class="sheet-body">
        <span class="sheet-cat" id="sheetCat"></span>
        <h2 class="sheet-name" id="sheetName"></h2>
        <p class="sheet-desc" id="sheetDesc"></p>
        <div class="sheet-foot">
          <span class="sheet-price" id="sheetPrice"></span>
          <span class="sheet-off" id="sheetOff" hidden>Non disponibile</span>
        </div>
      </div>
    </article>
  </div>

  <!-- VISUALIZZATORE FOTO -->
  <div class="lightbox" id="lightbox" hidden>
    <img alt="">
  </div>

  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="firebase-menu.js"></script>
</body>
</html>
